name: Build & Release Native APK

# Membuild APK Flutter Native release (signed, kunci stabil) lalu:
# 1. Commit APK ke public/apk/ → otomatis ter-deploy ke Vercel (link unduh publik).
# 2. Upload ke GitHub Releases & GitHub Actions Artifacts.
#
# Trigger:
#   - push tag "v*" (mis. v2.0.4)
#   - workflow_dispatch (manual trigger via gh CLI atau GitHub Web UI)
#   - push to master (hanya jika ada perubahan di mobile_petugas/** atau workflow ini)

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths:
      - "mobile_petugas/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Dependencies
        run: |
          flutter --version
          cd mobile_petugas
          flutter pub get

      - name: Build Flutter Native Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC\""
        run: |
          cd mobile_petugas
          flutter build apk --release
          cd ..
          mkdir -p public/apk
          
          FLUTTER_APK=$(find mobile_petugas/build build -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$FLUTTER_APK" ]; then
            FLUTTER_APK=$(find . -name "app-release.apk" 2>/dev/null | head -n 1)
          fi
          
          echo "Output APK ditemukan di: $FLUTTER_APK"
          cp "$FLUTTER_APK" public/apk/UPS-HERU-Petugas-Native.apk
          cp "$FLUTTER_APK" public/apk/O2W-Lapangan.apk
          ls -lh public/apk/

      - name: Extract Version
        id: ver
        run: |
          VERSION_LINE=$(grep -m1 '^version:' mobile_petugas/pubspec.yaml || echo "version: 2.0.4+24")
          VERSION_NAME=$(echo "$VERSION_LINE" | awk '{print $2}' | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | awk '{print $2}' | cut -d'+' -f2)
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Commit APK to repo (Auto-Deploy via Vercel)
        run: |
          git config user.email "cv.tigaputrasemesta@gmail.com"
          git config user.name "tigaputrasemesta-ctrl"
          git fetch origin master
          git checkout -B master origin/master
          git add public/apk/UPS-HERU-Petugas-Native.apk public/apk/O2W-Lapangan.apk
          if ! git diff --staged --quiet; then
            git commit -m "build(apk): auto-update native APK v${{ steps.ver.outputs.versionName }} binary [skip ci]"
            git push origin master
          else
            echo "Tidak ada perubahan pada binary APK."
          fi

      - name: Upload APK Artifact (Retensi 30 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: UPS-HERU-Petugas-Native-v${{ steps.ver.outputs.versionName }}
          path: public/apk/UPS-HERU-Petugas-Native.apk
          retention-days: 30

      - name: Ensure apk-latest tag (dispatch)
        if: github.ref_type != 'tag'
        run: |
          git tag -f apk-latest
          git push -f origin apk-latest

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'apk-latest' }}
          name: "UPS HERU Petugas Native v${{ steps.ver.outputs.versionName }}"
          body: "APK Flutter Native Petugas Lapangan v${{ steps.ver.outputs.versionName }} (versionCode ${{ steps.ver.outputs.versionCode }}).\n\nLink unduh publik:\n- https://upsheru.com/apk/UPS-HERU-Petugas-Native.apk\n- https://o2whero.com/apk/UPS-HERU-Petugas-Native.apk"
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: |
            public/apk/UPS-HERU-Petugas-Native.apk
            public/apk/O2W-Lapangan.apk
          artifactContentType: application/vnd.android.package-archive
          token: ${{ secrets.GITHUB_TOKEN }}
