name: Build & Release Native APK

# Membuild APK Flutter Native:
# 1. UPS HERU Petugas (Flutter Native Supir / Driver)
# 2. UPS HERU Admin (Flutter Native Backoffice Offline-First)
#
# Lalu:
# 1. Simpan ke public/apk/ untuk link download web.
# 2. Upload ke GitHub Releases & GitHub Actions Artifacts.

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
    paths:
      - "mobile_petugas/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Dependencies
        run: |
          flutter --version
          cd mobile_petugas
          flutter pub get
          cd ..

      - name: Build Flutter Native Release APK (Petugas / Supir)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC\""
        run: |
          cd mobile_petugas
          flutter build apk --release
          cd ..
          mkdir -p public/apk
          
          PETUGAS_APK=$(find mobile_petugas/build -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$PETUGAS_APK" ]; then
            PETUGAS_APK=$(find . -name "app-release.apk" 2>/dev/null | head -n 1)
          fi
          
          echo "Output Flutter Petugas APK ditemukan di: $PETUGAS_APK"
          cp "$PETUGAS_APK" public/apk/UPS-HERU-Petugas-Native.apk
          cp "$PETUGAS_APK" public/apk/O2W-Lapangan.apk
          
          # Bersihkan output build sebelum membuild target Admin
          rm -rf mobile_petugas/build/app/outputs/flutter-apk/*.apk

      - name: Build Flutter Native Release APK (Admin Backoffice)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=\"-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC\""
        run: |
          cd mobile_petugas
          flutter build apk --target lib/main_admin.dart -PcustomAppId=id.o2whero.admin -PcustomAppName="UPS HERU Admin" --release
          cd ..
          
          ADMIN_APK=$(find mobile_petugas/build -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$ADMIN_APK" ]; then
            ADMIN_APK=$(find . -name "app-release.apk" 2>/dev/null | head -n 1)
          fi
          
          echo "Output Flutter Admin APK ditemukan di: $ADMIN_APK"
          cp "$ADMIN_APK" public/apk/UPS-HERU-Admin.apk
          ls -lh public/apk/

      - name: Extract Versions
        id: ver
        run: |
          VERSION_LINE=$(grep -m1 '^version:' mobile_petugas/pubspec.yaml || echo "version: 2.0.5+25")
          VERSION_NAME=$(echo "$VERSION_LINE" | awk '{print $2}' | cut -d'+' -f1)
          VERSION_CODE=$(echo "$VERSION_LINE" | awk '{print $2}' | cut -d'+' -f2)
          echo "versionName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Upload Petugas APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPS-HERU-Petugas-Native-v${{ steps.ver.outputs.versionName }}
          path: public/apk/UPS-HERU-Petugas-Native.apk
          retention-days: 30

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPS-HERU-Admin-Native-v${{ steps.ver.outputs.versionName }}
          path: public/apk/UPS-HERU-Admin.apk
          retention-days: 30

      - name: Ensure apk-latest tag (dispatch)
        if: github.ref_type != 'tag'
        run: |
          git tag -f apk-latest
          git push -f origin apk-latest

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'apk-latest' }}
          name: "UPS HERU Native Mobile v${{ steps.ver.outputs.versionName }} (Driver & Admin)"
          body: |
            ### 📱 Paket Rilis Flutter Native Resmi UPS HERU

            #### 1. 🚛 Petugas & Driver Lapangan (Flutter Native)
            - **Versi**: v${{ steps.ver.outputs.versionName }} (Build ${{ steps.ver.outputs.versionCode }})
            - **Package ID**: `id.o2whero.lapangan`
            - **Unduh**: https://upsheru.com/apk/UPS-HERU-Petugas-Native.apk
            - **Fitur**: Auto-Popup Geofence (<30m), Haptic Buzz, Swipe to Pickup, Quick Skip Presets, Navigasi OSRM Bersih.

            #### 2. 🏢 Admin & Backoffice (Flutter Native Offline-First)
            - **Versi**: v${{ steps.ver.outputs.versionName }} (Build ${{ steps.ver.outputs.versionCode }})
            - **Package ID**: `id.o2whero.admin`
            - **Unduh**: https://upsheru.com/apk/UPS-HERU-Admin.apk
            - **Fitur**: 100% Flutter Native, Penyimpanan Data di HP (SharedPreferences Cache), Buka & Cari Data 0 Milidetik, Delta Push Sync, Monitor Armada & Warga.
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: false
          artifacts: |
            public/apk/UPS-HERU-Petugas-Native.apk
            public/apk/O2W-Lapangan.apk
            public/apk/UPS-HERU-Admin.apk
          artifactContentType: application/vnd.android.package-archive
          token: ${{ secrets.GITHUB_TOKEN }}
