name: Auto-Deploy to VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to SumoPod VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Memulai auto-deploy ke VPS SumoPod..."
            cd /home/ubuntu/wastepay
            
            echo "📥 Menarik perubahan kode terbaru dari Git..."
            GIT_TERMINAL_PROMPT=0 git fetch --quiet "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" master
            git reset --hard FETCH_HEAD
            
            mkdir -p public/uploads
            chmod 777 public/uploads
            
            echo "🐳 Membangun image Docker baru (container lama tetap online)..."
            docker compose build
            
            echo "🗄️ Menjalankan migrasi multi-tenant idempoten & backfill UPS HERU sebelum switchover..."
            docker compose run --rm --no-deps wastepay node scripts/deploy-multi-tenant-migrate.mjs
            
            echo "🔄 Me-restart container aplikasi dengan image terbaru..."
            docker compose up -d --no-build
            
            echo "🔒 Mengonfigurasi Caddy reverse proxy untuk domain tenant potonglink.com..."
            if [ -f /etc/caddy/Caddyfile ]; then
              if ! sudo grep -q "potonglink.com" /etc/caddy/Caddyfile; then
                echo -e "\npotonglink.com, www.potonglink.com {\n    reverse_proxy 127.0.0.1:3000\n}\n" | sudo tee -a /etc/caddy/Caddyfile
                sudo systemctl reload caddy || sudo service caddy reload || true
                echo "🌐 Caddyfile diperbarui dan Caddy di-reload."
              else
                sudo systemctl reload caddy || sudo service caddy reload || true
                echo "🌐 Domain potonglink.com sudah terdaftar di Caddyfile."
              fi
            else
              echo "⚠️ /etc/caddy/Caddyfile tidak ditemukan di host VPS."
            fi

            echo "🧹 Membersihkan image lama..."
            docker image prune -f
            
            echo "✅ Auto-deploy selesai dengan sukses!"
