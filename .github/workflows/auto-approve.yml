name: Bot Auto-Approve Calon Pelanggan

on:
  workflow_dispatch:
    inputs:
      skip_tanpa_zona:
        description: "Lewati calon pelanggan yang belum memiliki zona"
        required: true
        default: true
        type: boolean

jobs:
  approve:
    name: Auto Approve Pelanggan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Jalankan Script Auto-Approval
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ ERROR: Secret DATABASE_URL belum diatur di GitHub Repository Secrets."
            exit 1
          fi
          node scripts/auto-approve-calon.mjs
