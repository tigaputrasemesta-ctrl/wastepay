name: Database Auto-Backup

on:
  schedule:
    - cron: '15 20 * * *' # 03:15 WIB (UTC+7) saat trafik rendah
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL 15 Client & zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15 zstd || sudo apt-get install -y postgresql-client zstd

      - name: Run pg_dump via IPv4 Session Pooler
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_SESSION_POOLER_URL atau DATABASE_URL belum diatur di GitHub Settings > Secrets!"
            exit 1
          fi

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          echo "Memulai backup database ke wastepay_backup_${TIMESTAMP}.sql.zst..."

          # Otomatis alihkan port 6543 (transaction) ke 5432 (session pooler) agar pg_dump tidak error
          TARGET_URL=$(echo "$SUPABASE_DB_URL" | sed 's/:6543/:5432/' | sed 's/[?&]pgbouncer=true//g')

          pg_dump "$TARGET_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            | zstd -19 -o "wastepay_backup_${TIMESTAMP}.sql.zst"

          ls -lh wastepay_backup_${TIMESTAMP}.sql.zst

      - name: Upload Encrypted Backup Artifact (Retensi 14 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: wastepay-db-backup-${{ github.run_number }}
          path: "wastepay_backup_*.sql.zst"
          retention-days: 14
          if-no-files-found: error
