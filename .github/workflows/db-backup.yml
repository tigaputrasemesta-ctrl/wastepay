name: Database Auto-Backup

on:
  schedule:
    - cron: '15 20 * * *' # 03:15 WIB (UTC+7) saat trafik rendah
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install PostgreSQL Client & zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client zstd

      - name: Run pg_dump Database Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_SESSION_POOLER_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL belum diatur di GitHub Settings > Secrets!"
            exit 1
          fi

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          echo "Memulai backup database ke wastepay_backup_${TIMESTAMP}.sql.zst..."

          # Bersihkan parameter non-standar libpq (seperti ?schema=public, pgbouncer=true) yang ditolak pg_dump
          TARGET_URL=$(echo "$DATABASE_URL" \
            | sed 's/:6543/:5432/' \
            | sed -E 's/([?&])schema=[^&]*(&|$)/\1/g' \
            | sed -E 's/([?&])pgbouncer=[^&]*(&|$)/\1/g' \
            | sed -E 's/[?&]$//')

          pg_dump "$TARGET_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
            --clean \
            --if-exists \
            | zstd -19 -o "wastepay_backup_${TIMESTAMP}.sql.zst"

          ls -lh wastepay_backup_${TIMESTAMP}.sql.zst

      - name: Upload Encrypted Backup Artifact (Retensi 14 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: wastepay-db-backup-${{ github.run_number }}
          path: "wastepay_backup_*.sql.zst"
          retention-days: 14
          if-no-files-found: error
