    <script>
        $(function() {

            $('#registrant-location-photo').change(e => {
                const imageReader = new FileReader();

                imageReader.onload = e => {
                    $('#location-photo-preview').attr('src', e.target.result)
                    $('#location-photo-preview').show(200)
                }

                if (e.target.files.length > 0) {
                    imageReader.readAsDataURL(e.target.files[0])
                } else {
                    $('#location-photo-preview').hide(200)
                }
            })

            if (!('geolocation' in navigator)) {
                notiReportDanger(
                    'Lokasi tidak terdeteksi',
                    'Pastikan browser anda mendukung layanan lokasi. Formulir ini membutuhkan lokasi anda saat ini sebagai acuan data registrasi anda. Harap aktifkan fitur lokasi lalu akses kembali halaman ini',
                    _ => location.reload()
                )
            }

            navigator.geolocation.getCurrentPosition(
                position => {
                    $('#registrant-maps').val(
                        `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`
                    )
                },
                error => {
                    notiReportDanger(
                        'Lokasi tidak terdeteksi',
                        'Pastikan browser anda mendukung layanan lokasi. Formulir ini membutuhkan lokasi anda saat ini sebagai acuan data registrasi anda. Harap aktifkan fitur lokasi lalu akses kembali halaman ini',
                        _ => location.reload()
                    )
                }
            )

            $('#registrant-form').submit(function(e) {
                e.preventDefault();

                // Confirm check if location feature is working well
                const maps = $('#registrant-maps').val()
                if ((maps == '') || (maps == null)) {
                    notiReportDanger(
                        'Lokasi tidak terdeteksi',
                        'Pastikan browser anda mendukung layanan lokasi. Formulir ini membutuhkan lokasi anda saat ini sebagai acuan data registrasi anda. Harap aktifkan fitur lokasi lalu akses kembali halaman ini',
                        _ => location.reload()
                    )
                    return 0
                }

                sendForm(
                    this,
                    response => {
                        if (response.status == 200) {
                            notiReportSuccess('Registrasi Berhasil Dikirim', response.message, _ => {
                                location.href = 'https://skylite.id/'
                            })
                        } else if (response.status == 500) {
                            notiReportDanger('Terjadi Kesalahan', response.message)
                        }
                    },
                    error => {
                        notiReportDanger(
                            'ERROR',
                            'Terjadi kesalahan saat memproses permintaan anda. Harap hubungi customer service kami.',
                            _ => location.reload()
                        )
                        console.log(error.responseText)
                    }
                )
            })
        });
    </script>
